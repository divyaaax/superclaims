services:
  - type: web
    name: superclaims-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK_LLM
        value: "true"
      - key: LLM_MODEL
        value: "gpt-4o-mini"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: BATCH_SIZE
        value: "5"
      - key: LOG_LEVEL
        value: "INFO"
